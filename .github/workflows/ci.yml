name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

env:
  WINGLET_VERIFY_IMAGE: winglet-base-php85-ci:${{ github.sha }}
  KEEP_IMAGE: "1"

jobs:
  verify:
    name: Dockerfile and PHP 8.5 verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:latest-alpine < Dockerfile

      - name: Build and verify image
        run: ./scripts/verify-php85.sh

      - name: Scan image on main and version tags
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          FAIL_ON_FINDINGS: "1"
        run: ./scripts/scan-security.sh "$WINGLET_VERIFY_IMAGE"

      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_id }}
          path: |
            .verification/php85/**
            .verification/security/**
          if-no-files-found: ignore
          retention-days: 7
