name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

env:
  WINGLET_VERIFY_IMAGE: winglet-base-php85-ci:${{ github.sha }}
  KEEP_IMAGE: "1"

jobs:
  verify:
    name: Dockerfile and PHP 8.5 verification
    runs-on: ubuntu-latest
    concurrency:
      group: dockerhub-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate version tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]]; then
            printf 'Invalid release tag: %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:latest-alpine < Dockerfile

      - name: Build and verify image
        run: ./scripts/verify-php85.sh

      - name: Scan image on main and version tags
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          FAIL_ON_FINDINGS: "1"
        run: ./scripts/scan-security.sh "$WINGLET_VERIFY_IMAGE"

      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_id }}
          path: |
            .verification/php85/**
            .verification/security/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Check Docker Hub tag is unused
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          repository_url='https://hub.docker.com/v2/repositories/akikettu/wingletbase/'
          tag_url="${repository_url}tags/${GITHUB_REF_NAME}"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          if ! status="$(curl --silent --show-error --location --output "$response_file" --write-out '%{http_code}' --max-time 20 "$repository_url")"; then
            echo 'Could not query Docker Hub repository; refusing to publish.' >&2
            exit 1
          fi
          if [[ "$status" != '200' ]]; then
            printf 'Docker Hub repository check returned HTTP %s; refusing to publish.\n' "$status" >&2
            exit 1
          fi

          if ! status="$(curl --silent --show-error --location --output "$response_file" --write-out '%{http_code}' --max-time 20 "$tag_url")"; then
            echo 'Could not query Docker Hub tag; refusing to publish.' >&2
            exit 1
          fi
          case "$status" in
            404) echo "Docker Hub tag ${GITHUB_REF_NAME} is unused." ;;
            200) printf 'Docker Hub tag %s already exists; refusing to overwrite it.\n' "$GITHUB_REF_NAME" >&2; exit 1 ;;
            *) printf 'Docker Hub tag check returned HTTP %s; refusing to publish.\n' "$status" >&2; exit 1 ;;
          esac

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push verified image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          DOCKERHUB_IMAGE: akikettu/wingletbase
        run: |
          set -euo pipefail
          source_image_id="$(docker image inspect --format '{{.Id}}' "$WINGLET_VERIFY_IMAGE")"
          release_image="${DOCKERHUB_IMAGE}:${GITHUB_REF_NAME}"
          docker tag "$WINGLET_VERIFY_IMAGE" "$release_image"
          release_image_id="$(docker image inspect --format '{{.Id}}' "$release_image")"
          if [[ "$source_image_id" != "$release_image_id" ]]; then
            printf 'Image ID mismatch: verified=%s release=%s\n' "$source_image_id" "$release_image_id" >&2
            exit 1
          fi
          printf 'Pushing verified image %s with image ID %s\n' "$release_image" "$release_image_id"
          docker push "$release_image"
